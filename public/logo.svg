<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="64" rx="28" fill="url(#sheen)"/>
  <!-- quill: shaft from the nib (bottom left) to the tip (top right); broad vane above the shaft, slimmer one below -->
  <path d="M48 78 C 22 54, 40 8, 108 18 C 86 38, 66 60, 48 78 Z" fill="#fff"/>
  <path d="M56 72 C 72 58, 90 40, 108 18 C 108 46, 92 70, 58 76 Z" fill="#fff" opacity=".93"/>
  <!-- shaft, cut out between the vanes -->
  <path d="M50 76 C 68 60, 88 40, 107 19" fill="none" stroke="url(#bg)" stroke-width="3.6" stroke-linecap="round"/>
  <!-- barbs, leaning toward the tip -->
  <path d="M58 68 L 46 56 M67 59 L 57 44 M76 50 L 68 34 M85 41 L 80 26 M94 32 L 92 20 M66 62 L 74 70 M76 52 L 86 60 M86 42 L 96 48" fill="none" stroke="url(#bg)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- calamus: bare stem tapering to the nib -->
  <path d="M45 73 C 40 82, 34 92, 26 104 L 23 100 C 30 90, 36 82, 51 79 Z" fill="#fff"/>
</svg>
