<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="64" rx="28" fill="url(#sheen)"/>
  <!-- feather: two curves meeting at the tip (top right) and the nib (bottom left) -->
  <path d="M38 94 C 34 60, 58 32, 102 22 C 94 62, 72 86, 38 94 Z" fill="#fff" opacity=".97"/>
  <!-- shaft, cut out of the vane -->
  <path d="M40 92 C 56 70, 74 50, 100 24" fill="none" stroke="url(#bg)" stroke-width="5" stroke-linecap="round"/>
  <!-- barbs, cut out of the lower vane -->
  <path d="M58 72 L 66 84 M70 58 L 80 68" fill="none" stroke="url(#bg)" stroke-width="4" stroke-linecap="round"/>
  <!-- quill below the vane, ending in the nib -->
  <path d="M40 92 L 26 108" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <!-- the written line -->
  <path d="M46 108 H 86" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
</svg>
